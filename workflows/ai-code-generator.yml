name: AI Code & Image Generator

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Describe what you want to generate'
        required: true
        type: string
      branch_name:
        description: 'Branch name (optional, auto-generated if empty)'
        required: false
        type: string
      generate_images:
        description: 'Generate images?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-with-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openai requests pillow

      - name: Create AI-generated content
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/ai_generator.py \
            --prompt "${{ inputs.prompt }}" \
            --branch "${{ inputs.branch_name }}" \
            --generate-images ${{ inputs.generate_images }}

      - name: Get branch name
        id: branch
        run: |
          BRANCH_NAME=$(cat /tmp/branch_name.txt 2>/dev/null || echo "ai-feature-$(date +%s)")
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Create and push branch
        run: |
          git config user.name "AI Bot"
          git config user.email "ai@bracerumpark.dev"
          git checkout -b ${{ steps.branch.outputs.name }}
          git add -A
          git commit -m "feat: AI-generated - ${{ inputs.prompt }}" || echo "No changes to commit"
          git push -u origin ${{ steps.branch.outputs.name }}

      - name: Create Pull Request
        run: |
          gh pr create \
            --title "🤖 AI: ${{ inputs.prompt }}" \
            --body "## AI-Generated Content

**Prompt:** ${{ inputs.prompt }}

### Details
- Generated with GPT-4
- Review and merge to apply
- Auto-generated branch: ${{ steps.branch.outputs.name }}

---
*Generated by AI Bot*" \
            --head ${{ steps.branch.outputs.name }} \
            --base main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
